services:
  postgres:
    image: postgres:15-alpine
    container_name: arctic-mirror-postgres
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: replicator
      POSTGRES_PASSWORD: secret
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U replicator -d mydb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: arctic-mirror-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
      - MINIO_DOMAIN=minio
      - MINIO_REGION_NAME=us-east-1
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      default:
        aliases:
          - warehouse.minio
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  iceberg-catalog:
    image: tabulario/iceberg-rest:latest
    container_name: arctic-mirror-iceberg-catalog
    ports:
      - "8181:8181"
    environment:
      - CATALOG_WAREHOUSE=s3://warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://minio:9000
      - CATALOG_S3_PATH__STYLE__ACCESS=true
      - CATALOG_S3_ACCESS_KEY_ID=admin
      - CATALOG_S3_SECRET_ACCESS_KEY=password
      - CATALOG_S3_REGION=us-east-1
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  arctic-mirror:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arctic-mirror-main
    depends_on:
      postgres:
        condition: service_healthy
      iceberg-catalog:
        condition: service_healthy
    ports:
      - "5433:5433"  # Proxy port
      - "8080:8080"  # Health check port
    volumes:
      - ./config.yaml:/app/config/config.yaml:ro
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=replicator
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=mydb
      - ICEBERG_CATALOG_ENDPOINT=http://iceberg-catalog:8181
      - ICEBERG_CATALOG_CLIENT_ID=admin
      - ICEBERG_CATALOG_CLIENT_SECRET=password
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY_ID=admin
      - S3_SECRET_ACCESS_KEY=password
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  test-client:
    image: postgres:15-alpine
    container_name: arctic-mirror-test-client
    depends_on:
      arctic-mirror:
        condition: service_healthy
    environment:
      PGPASSWORD: secret
    command: >
      sh -c "
        echo 'Waiting for Arctic Mirror to be ready...' &&
        until pg_isready -h arctic-mirror -p 5433 -U replicator; do
          sleep 2;
        done &&
        echo 'Testing connection to Arctic Mirror proxy...' &&
        psql -h arctic-mirror -p 5433 -U replicator -d mydb -c 'SELECT version();' &&
        echo 'Connection test successful!'
      "
    restart: "no"

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  default:
    name: arctic-mirror-network
