postgres:
  host: postgres
  port: 5432
  user: replicator
  password: secret
  database: mydb
  slot: iceberg_replica
  publication: pub_all

tables:
  - schema: public
    name: users
  - schema: public
    name: orders
  - schema: public
    name: products

iceberg:
  path: /app/warehouse
  catalog_endpoint: http://iceberg-catalog:8181
  client_id: admin
  client_secret: password
  s3_endpoint: http://minio:9000
  s3_access_key_id: admin
  s3_secret_access_key: password

proxy:
  port: 5433

